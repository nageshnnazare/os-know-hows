<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 388" width="740" height="388" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Where the operating system sits</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="370.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Where the operating system sits</text><rect x="180" y="58" width="380" height="52" rx="9" ry="9" fill="#6B7B94"/><text x="370.0" y="84.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="370.0" dy="0">Users</tspan></text><rect x="180" y="120" width="380" height="52" rx="9" ry="9" fill="#3E7CC0"/><text x="370.0" y="138.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="370.0" dy="0">Application programs</tspan><tspan x="370.0" dy="15">(compilers, browsers, editors)</tspan></text><rect x="180" y="182" width="380" height="52" rx="9" ry="9" fill="#1F918C"/><text x="370.0" y="208.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="370.0" dy="0">System programs &amp; libraries</tspan></text><rect x="180" y="244" width="380" height="52" rx="9" ry="9" fill="#2F5F98"/><text x="370.0" y="270.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="370.0" dy="0">Operating system  ·  kernel</tspan></text><rect x="180" y="306" width="380" height="52" rx="9" ry="9" fill="#55637A"/><text x="370.0" y="324.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="370.0" dy="0">Hardware</tspan><tspan x="370.0" dy="15">(CPU · memory · I/O devices)</tspan></text><text x="370.0" y="374" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">each layer uses only the services of the layer beneath it</text></svg>

s MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="540.0" dy="0"></tspan></text><line x1="210" y1="158" x2="280" y2="158" stroke="#1F918C" stroke-width="1.7" marker-end="url(#ah-t)"/><line x1="580" y1="158" x2="660" y2="158" stroke="#3E7CC0" stroke-width="1.7" marker-end="url(#ah-p)"/><text x="430" y="232" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="500" text-anchor="middle" dominant-baseline="central">empty ↓ (wait if full)   ·   full ↑ (wait if empty)   ·   mutex for the buffer</text><text x="440.0" y="266" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">semaphores empty and full count slots; mutex guards the shared buffer</text></svg>

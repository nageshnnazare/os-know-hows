<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Asymmetric (public-key) encryption</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="420.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Asymmetric (public-key) encryption</text><rect x="60" y="150" width="130" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="125.0" y="175.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="125.0" dy="0">Sender</tspan></text><rect x="660" y="150" width="130" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="725.0" y="175.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="725.0" dy="0">Receiver</tspan></text><rect x="280" y="90" width="130" height="44" rx="9" ry="9" fill="#1F918C"/><text x="345.0" y="112.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="345.0" dy="0">plaintext</tspan></text><rect x="280" y="210" width="170" height="44" rx="9" ry="9" fill="#3E7CC0"/><text x="365.0" y="225.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="365.0" dy="0">receiver's</tspan><tspan x="365.0" dy="13">public key</tspan></text><rect x="470" y="150" width="150" height="50" rx="9" ry="9" fill="#D9922B"/><text x="545.0" y="175.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="545.0" dy="0">ciphertext</tspan></text><rect x="500" y="250" width="170" height="44" rx="9" ry="9" fill="#2F5F98"/><text x="585.0" y="265.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="585.0" dy="0">receiver's</tspan><tspan x="585.0" dy="13">private key</tspan></text><line x1="190" y1="165" x2="280" y2="120" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><line x1="345" y1="134" x2="470" y2="165" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="410" y="118" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central">encrypt</text><line x1="345" y1="210" x2="430" y2="180" stroke="#3E7CC0" stroke-width="1.4" marker-end="url(#ah-p)" stroke-dasharray="4 3"/><line x1="620" y1="170" x2="660" y2="170" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><line x1="560" y1="250" x2="560" y2="200" stroke="#2F5F98" stroke-width="1.4" marker-end="url(#ah-g)" stroke-dasharray="4 3"/><text x="600" y="220" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central">decrypt</text><text x="420.0" y="306" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">anyone can encrypt with the public key; only the private key decrypts</text></svg>

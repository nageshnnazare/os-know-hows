<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Two IPC models: share memory or pass messages</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="450.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Two IPC models: share memory or pass messages</text><text x="210" y="58" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Shared memory</text><rect x="60" y="84" width="130" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="125.0" y="109.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="125.0" dy="0">Process A</tspan></text><rect x="280" y="84" width="130" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="345.0" y="109.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="345.0" dy="0">Process B</tspan></text><rect x="150" y="210" width="170" height="50" rx="9" ry="9" fill="#1F918C"/><text x="235.0" y="235.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="235.0" dy="0">shared region</tspan></text><line x1="125" y1="134" x2="200" y2="210" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><line x1="345" y1="134" x2="270" y2="210" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="235" y="285" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="500" text-anchor="middle" dominant-baseline="central">kernel maps it once; then direct reads/writes</text><line x1="450" y1="74" x2="450" y2="300" stroke="#9AA0B4" stroke-width="1" stroke-dasharray="4 4"/><text x="620" y="58" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Message passing</text><rect x="500" y="84" width="130" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="565.0" y="109.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="565.0" dy="0">Process A</tspan></text><rect x="720" y="84" width="130" height="50" rx="9" ry="9" fill="#6B7B94"/><text x="785.0" y="109.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="785.0" dy="0">Process B</tspan></text><rect x="560" y="200" width="230" height="50" rx="9" ry="9" fill="#2F5F98"/><text x="675.0" y="218.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="675.0" dy="0">kernel</tspan><tspan x="675.0" dy="14">send() / receive()</tspan></text><line x1="565" y1="134" x2="620" y2="200" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><line x1="785" y1="134" x2="730" y2="200" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="675" y="285" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9" font-weight="500" text-anchor="middle" dominant-baseline="central">every message is copied through the kernel</text></svg>

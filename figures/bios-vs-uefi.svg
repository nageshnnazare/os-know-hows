<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Legacy BIOS vs UEFI firmware</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="430.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Legacy BIOS vs UEFI firmware</text><rect x="80" y="80" width="300" height="40" rx="9" ry="9" fill="#6B7B94"/><text x="230.0" y="100.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="230.0" dy="0">Legacy BIOS</tspan></text><text x="96" y="138" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• 16-bit real mode</text><text x="96" y="168" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• MBR partitioning (&lt; 2 TB)</text><text x="96" y="198" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• boot code in 512-byte sector</text><text x="96" y="228" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• no secure boot</text><text x="96" y="258" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• slow, sequential POST</text><rect x="500" y="80" width="300" height="40" rx="9" ry="9" fill="#3E7CC0"/><text x="650.0" y="100.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="650.0" dy="0">UEFI</tspan></text><text x="516" y="138" fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• 32/64-bit, drivers</text><text x="516" y="168" fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• GPT partitioning (huge disks)</text><text x="516" y="198" fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• EFI apps on a FAT partition</text><text x="516" y="228" fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• Secure Boot</text><text x="516" y="258" fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• faster, parallel init</text></svg>

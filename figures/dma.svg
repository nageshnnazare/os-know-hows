<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Direct Memory Access frees the CPU during bulk transfers</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="320.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Direct Memory Access frees the CPU during bulk transfers</text><rect x="60" y="90" width="140" height="54" rx="9" ry="9" fill="#6B7B94"/><text x="130.0" y="117.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="130.0" dy="0">CPU</tspan></text><rect x="60" y="240" width="160" height="54" rx="9" ry="9" fill="#3E7CC0"/><text x="140.0" y="267.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="140.0" dy="0">DMA controller</tspan></text><rect x="340" y="240" width="150" height="54" rx="9" ry="9" fill="#1F918C"/><text x="415.0" y="260.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="415.0" dy="0">device</tspan><tspan x="415.0" dy="14">(disk / NIC)</tspan></text><rect x="340" y="90" width="150" height="54" rx="9" ry="9" fill="#1F918C"/><text x="415.0" y="117.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="415.0" dy="0">main memory</tspan></text><line x1="130" y1="144" x2="130" y2="240" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="150" y="195" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="start" dominant-baseline="central">1. program</text><text x="150" y="209" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="start" dominant-baseline="central">   the transfer</text><line x1="220" y1="267" x2="340" y2="267" stroke="#3E7CC0" stroke-width="1.8" marker-end="url(#ah-p)"/><text x="280" y="255" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central">2. bus</text><path d="M220 250 C280 180 300 150 340 130" fill="none" stroke="#3E7CC0" stroke-width="1.8" marker-end="url(#ah-p)"/><text x="310" y="200" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="start" dominant-baseline="central">3. device ↔ memory</text><path d="M130 240 C90 200 90 180 128 145" fill="none" stroke="#D65A5F" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-r)"/><text x="150" y="165" fill="#D65A5F" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="700" text-anchor="start" dominant-baseline="central">4. interrupt</text><text x="150" y="179" fill="#D65A5F" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="700" text-anchor="start" dominant-baseline="central">   when done</text><text x="320.0" y="326" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">the CPU sets up the transfer; the DMA controller moves the data</text></svg>

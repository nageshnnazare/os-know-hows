<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Priority inversion</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="430.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Priority inversion</text><rect x="60" y="90" width="120" height="40" rx="9" ry="9" fill="#D65A5F"/><text x="120.0" y="110.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="120.0" dy="0">High  H</tspan></text><rect x="60" y="150" width="120" height="40" rx="9" ry="9" fill="#D9922B"/><text x="120.0" y="170.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="120.0" dy="0">Med  M</tspan></text><rect x="60" y="210" width="120" height="40" rx="9" ry="9" fill="#1F918C"/><text x="120.0" y="230.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="120.0" dy="0">Low  L</tspan></text><rect x="200" y="210" width="90" height="40" rx="5" ry="5" fill="#1F918C"/><text x="245.0" y="230.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="245.0" dy="0">holds lock</tspan></text><rect x="290" y="90" width="250" height="40" rx="5" ry="5" fill="none" stroke="#D65A5F" stroke-width="1.5" stroke-dasharray="4 3"/><text x="415" y="110" fill="#D65A5F" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central">H blocked, waiting for lock</text><rect x="290" y="150" width="250" height="40" rx="5" ry="5" fill="#D9922B"/><text x="415.0" y="170.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="415.0" dy="0">M runs (preempts L)</tspan></text><rect x="540" y="210" width="120" height="40" rx="5" ry="5" fill="#1F918C"/><text x="600.0" y="230.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="600.0" dy="0">L resumes</tspan></text><rect x="660" y="90" width="120" height="40" rx="5" ry="5" fill="#D65A5F"/><text x="720.0" y="110.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="720.0" dy="0">H runs</tspan></text><line x1="200" y1="270" x2="780" y2="270" stroke="#9AA0B4" stroke-width="1"/><text x="490" y="286" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">time →</text><text x="415" y="60" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">M delays H indefinitely — priority inversion</text><text x="430.0" y="306" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">fix with priority inheritance: L temporarily inherits H's priority</text></svg>

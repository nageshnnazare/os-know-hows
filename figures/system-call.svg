<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>A system call crosses the user / kernel boundary</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="400.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">A system call crosses the user / kernel boundary</text><line x1="60" y1="150" x2="760" y2="150" stroke="#9AA0B4" stroke-width="1.2" stroke-dasharray="5 4"/><text x="72" y="138" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="start" dominant-baseline="central">user mode</text><text x="72" y="166" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="start" dominant-baseline="central">kernel mode</text><rect x="60" y="80" width="190" height="54" rx="9" ry="9" fill="#6B7B94"/><text x="155.0" y="99.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="155.0" dy="0">User process</tspan><tspan x="155.0" dy="15">read(fd, buf, n)</tspan></text><rect x="300" y="80" width="190" height="54" rx="9" ry="9" fill="#3E7CC0"/><text x="395.0" y="99.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="395.0" dy="0">C library wrapper</tspan><tspan x="395.0" dy="15">(glibc)</tspan></text><rect x="300" y="185" width="190" height="54" rx="9" ry="9" fill="#2F5F98"/><text x="395.0" y="204.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="395.0" dy="0">syscall handler</tspan><tspan x="395.0" dy="15">(dispatch table)</tspan></text><rect x="560" y="185" width="190" height="54" rx="9" ry="9" fill="#1F918C"/><text x="655.0" y="204.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="655.0" dy="0">kernel service</tspan><tspan x="655.0" dy="15">routine</tspan></text><line x1="250" y1="107" x2="300" y2="107" stroke="#6B7B94" stroke-width="1.7" marker-end="url(#ah-g)"/><line x1="395" y1="134" x2="395" y2="185" stroke="#3E7CC0" stroke-width="1.8" marker-end="url(#ah-p)"/><text x="500" y="170" fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">trap  (int / syscall)</text><line x1="490" y1="212" x2="560" y2="212" stroke="#6B7B94" stroke-width="1.7" marker-end="url(#ah-g)"/><path d="M655 185 C655 142 300 142 250 126" fill="none" stroke="#6B7B94" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-g)"/><text x="430" y="138" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central">return value</text><text x="400.0" y="286" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">the mode switch is the only gateway into privileged code</text></svg>

 x="686" y="120" width="96" height="40" rx="9" ry="9" fill="#3E7CC0"/><text x="734.0" y="140.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="734.0" dy="0">Bins/libs</tspan></text><rect x="470" y="168" width="320" height="40" rx="9" ry="9" fill="#D9922B"/><text x="630.0" y="188.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="630.0" dy="0">Container engine</tspan></text><rect x="470" y="210" width="320" height="40" rx="9" ry="9" fill="#2F5F98"/><text x="630.0" y="230.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="630.0" dy="0">Host OS  (shared kernel)</tspan></text><rect x="470" y="252" width="320" height="38" rx="9" ry="9" fill="#55637A"/><text x="630.0" y="271.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="630.0" dy="0">Hardware</tspan></text><text x="630" y="305" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central">no guest OS → lighter, faster</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Two privilege levels, one controlled transition</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="390.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Two privilege levels, one controlled transition</text><rect x="65" y="90" width="260" height="150" rx="12" ry="12" fill="#6B7B94"/><text x="195.0" y="165.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="195.0" dy="0"></tspan></text><text x="205" y="112" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central">User mode  (ring 3)</text><text x="110" y="146" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• restricted instructions</text><text x="110" y="172" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• no direct I/O</text><text x="110" y="198" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• own virtual address space</text><rect x="475" y="90" width="260" height="150" rx="12" ry="12" fill="#2F5F98"/><text x="605.0" y="165.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="605.0" dy="0"></tspan></text><text x="580" y="112" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Kernel mode  (ring 0)</text><text x="495" y="146" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• all instructions</text><text x="495" y="172" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• direct hardware access</text><text x="495" y="198" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">• manages every process</text><path d="M350 130 C400 110 400 110 450 130" fill="none" stroke="#3E7CC0" stroke-width="1.8" marker-end="url(#ah-p)"/><text x="400" y="96" fill="#3E7CC0" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">syscall / interrupt / trap</text><path d="M450 200 C400 220 400 220 350 200" fill="none" stroke="#6B7B94" stroke-width="1.8" marker-end="url(#ah-g)"/><text x="400" y="232" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">return  (mode bit → user)</text></svg>

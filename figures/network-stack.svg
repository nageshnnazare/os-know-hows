<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 364" width="780" height="364" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>The TCP/IP protocol stack</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="390.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">The TCP/IP protocol stack</text><rect x="160" y="60" width="300" height="48" rx="9" ry="9" fill="#1F918C"/><text x="310.0" y="84.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="310.0" dy="0">Application</tspan></text><text x="480" y="84" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="central">HTTP · DNS · SSH</text><rect x="160" y="116" width="300" height="48" rx="9" ry="9" fill="#3E7CC0"/><text x="310.0" y="140.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="310.0" dy="0">Transport</tspan></text><text x="480" y="140" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="central">TCP · UDP  (ports)</text><rect x="160" y="172" width="300" height="48" rx="9" ry="9" fill="#2F5F98"/><text x="310.0" y="196.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="310.0" dy="0">Network</tspan></text><text x="480" y="196" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="central">IP  (addresses, routing)</text><rect x="160" y="228" width="300" height="48" rx="9" ry="9" fill="#D9922B"/><text x="310.0" y="252.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="310.0" dy="0">Link</tspan></text><text x="480" y="252" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="central">Ethernet · Wi-Fi (frames)</text><rect x="160" y="284" width="300" height="48" rx="9" ry="9" fill="#55637A"/><text x="310.0" y="308.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="310.0" dy="0">Physical</tspan></text><text x="480" y="308" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="central">bits on the wire</text><line x1="120" y1="70" x2="120" y2="320" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="96" y="200.0" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">send</text><text x="96" y="216.0" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central">↓</text><text x="390.0" y="350" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">each layer adds a header; the peer layer on the far side reads it</text></svg>

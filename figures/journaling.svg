<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Write-ahead journaling keeps the file system consistent</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="410.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Write-ahead journaling keeps the file system consistent</text><rect x="60" y="100" width="210" height="62" rx="9" ry="9" fill="#3E7CC0"/><text x="165.0" y="123.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="165.0" dy="0">1. write intent</tspan><tspan x="165.0" dy="15">to the journal (log)</tspan></text><line x1="270" y1="131" x2="310" y2="131" stroke="#6B7B94" stroke-width="1.7" marker-end="url(#ah-g)"/><rect x="310" y="100" width="210" height="62" rx="9" ry="9" fill="#D9922B"/><text x="415.0" y="123.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="415.0" dy="0">2. commit record</tspan><tspan x="415.0" dy="15">journal is durable</tspan></text><line x1="520" y1="131" x2="560" y2="131" stroke="#6B7B94" stroke-width="1.7" marker-end="url(#ah-g)"/><rect x="560" y="100" width="210" height="62" rx="9" ry="9" fill="#1F918C"/><text x="665.0" y="123.5" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="665.0" dy="0">3. checkpoint</tspan><tspan x="665.0" dy="15">apply to main FS</tspan></text><rect x="60" y="220" width="460" height="40" rx="9" ry="9" fill="#2F5F98"/><text x="290.0" y="240.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="290.0" dy="0">journal (circular log)</tspan></text><rect x="560" y="220" width="200" height="40" rx="9" ry="9" fill="#6B7B94"/><text x="660.0" y="240.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="660.0" dy="0">main file system</tspan></text><line x1="520" y1="240" x2="560" y2="240" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><text x="400" y="300" fill="#D65A5F" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">after a crash: replay committed transactions, discard the rest</text></svg>

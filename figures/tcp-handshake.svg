<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>TCP three-way handshake</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="400.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">TCP three-way handshake</text><rect x="90" y="70" width="150" height="44" rx="9" ry="9" fill="#3E7CC0"/><text x="165.0" y="92.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="165.0" dy="0">Client</tspan></text><rect x="560" y="70" width="150" height="44" rx="9" ry="9" fill="#1F918C"/><text x="635.0" y="92.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="635.0" dy="0">Server</tspan></text><line x1="165" y1="114" x2="165" y2="320" stroke="#9AA0B4" stroke-width="1.2"/><line x1="635" y1="114" x2="635" y2="320" stroke="#9AA0B4" stroke-width="1.2"/><line x1="165" y1="150" x2="635" y2="150" stroke="#3E7CC0" stroke-width="1.7" marker-end="url(#ah-p)"/><text x="400" y="140" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">SYN  seq=x</text><line x1="635" y1="200" x2="165" y2="200" stroke="#1F918C" stroke-width="1.7" marker-end="url(#ah-t)"/><text x="400" y="190" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">SYN-ACK  seq=y, ack=x+1</text><line x1="165" y1="250" x2="635" y2="250" stroke="#3E7CC0" stroke-width="1.7" marker-end="url(#ah-p)"/><text x="400" y="240" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">ACK  ack=y+1</text><text x="165" y="300" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">ESTABLISHED</text><text x="635" y="300" fill="#1F918C" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">ESTABLISHED</text><text x="400.0" y="326" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">three segments synchronise sequence numbers before any data flows</text></svg>

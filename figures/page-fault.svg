rect x="330" y="90" width="210" height="56" rx="9" ry="9" fill="#D9922B"/><text x="435.0" y="118.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="435.0" dy="0">valid bit = 0 → trap to OS</tspan></text><line x1="540" y1="118" x2="600" y2="118" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><rect x="600" y="90" width="210" height="56" rx="9" ry="9" fill="#3E7CC0"/><text x="705.0" y="118.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="705.0" dy="0">locate page on disk</tspan></text><rect x="60" y="200" width="210" height="56" rx="9" ry="9" fill="#1F918C"/><text x="165.0" y="228.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="165.0" dy="0">load into a free frame</tspan></text><line x1="270" y1="228" x2="330" y2="228" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><rect x="330" y="200" width="210" height="56" rx="9" ry="9" fill="#3E7CC0"/><text x="435.0" y="228.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="435.0" dy="0">update page table</tspan></text><line x1="540" y1="228" x2="600" y2="228" stroke="#6B7B94" stroke-width="1.6" marker-end="url(#ah-g)"/><rect x="600" y="200" width="210" height="56" rx="9" ry="9" fill="#1F918C"/><text x="705.0" y="228.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="705.0" dy="0">restart instruction</tspan></text><path d="M705 146 C705 180 165 180 165 190" fill="none" stroke="#6B7B94" stroke-width="1.5" marker-end="url(#ah-g)"/><text x="440.0" y="276" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">a missing page is fetched from disk, then the instruction re-runs</text></svg>

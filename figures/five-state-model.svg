central">interrupt / timeout</text><line x1="600" y1="146" x2="435" y2="252" stroke="#D9922B" stroke-width="1.7" marker-end="url(#ah-a)"/><text x="575" y="210" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="middle" dominant-baseline="central">I/O or event wait</text><path d="M300 262 C250 220 250 140 300 128" fill="none" stroke="#1F918C" stroke-width="1.6" marker-end="url(#ah-t)"/><text x="252" y="196" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="end" dominant-baseline="central">I/O done</text><line x1="700" y1="118" x2="760" y2="172" stroke="#6B7B94" stroke-width="1.7" marker-end="url(#ah-g)"/><text x="722" y="142" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="600" text-anchor="start" dominant-baseline="central">exit</text><text x="490.0" y="316" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">the scheduler moves a process between Ready and Running</text></svg>

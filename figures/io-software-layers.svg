<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>The layered I/O software stack</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="390.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">The layered I/O software stack</text><rect x="200" y="58" width="380" height="52" rx="9" ry="9" fill="#6B7B94"/><text x="390.0" y="77.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="390.0" dy="0">User-level I/O software</tspan><tspan x="390.0" dy="14">(library calls, spooling)</tspan></text><rect x="200" y="118" width="380" height="52" rx="9" ry="9" fill="#3E7CC0"/><text x="390.0" y="137.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="390.0" dy="0">Device-independent OS software</tspan><tspan x="390.0" dy="14">(naming, buffering, allocation)</tspan></text><rect x="200" y="178" width="380" height="52" rx="9" ry="9" fill="#1F918C"/><text x="390.0" y="204.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="390.0" dy="0">Device drivers</tspan></text><rect x="200" y="238" width="380" height="52" rx="9" ry="9" fill="#D9922B"/><text x="390.0" y="264.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="390.0" dy="0">Interrupt handlers</tspan></text><rect x="200" y="298" width="380" height="52" rx="9" ry="9" fill="#55637A"/><text x="390.0" y="317.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="390.0" dy="0">Hardware</tspan><tspan x="390.0" dy="14">(controllers &amp; devices)</tspan></text><text x="390.0" y="366" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">each layer hides device detail from the layer above</text></svg>

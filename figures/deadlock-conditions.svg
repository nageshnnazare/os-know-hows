<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>The four necessary conditions for deadlock</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="430.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">The four necessary conditions for deadlock</text><rect x="50" y="90" width="175" height="70" rx="9" ry="9" fill="#3E7CC0"/><text x="137.5" y="125.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="137.5" dy="0">Mutual exclusion</tspan></text><text x="137" y="178" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="500" text-anchor="middle" dominant-baseline="central">a resource is held</text><text x="137" y="194" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="500" text-anchor="middle" dominant-baseline="central">by one process</text><text x="235" y="125" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text><rect x="245" y="90" width="175" height="70" rx="9" ry="9" fill="#1F918C"/><text x="332.5" y="125.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="332.5" dy="0">Hold and wait</tspan></text><text x="332" y="178" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="500" text-anchor="middle" dominant-baseline="central">hold one, wait</text><text x="332" y="194" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="500" text-anchor="middle" dominant-baseline="central">for another</text><text x="430" y="125" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text><rect x="440" y="90" width="175" height="70" rx="9" ry="9" fill="#D9922B"/><text x="527.5" y="125.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="527.5" dy="0">No preemption</tspan></text><text x="527" y="178" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="500" text-anchor="middle" dominant-baseline="central">can't force a</text><text x="527" y="194" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="500" text-anchor="middle" dominant-baseline="central">resource away</text><text x="625" y="125" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text><rect x="635" y="90" width="175" height="70" rx="9" ry="9" fill="#D65A5F"/><text x="722.5" y="125.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="722.5" dy="0">Circular wait</tspan></text><text x="722" y="178" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="500" text-anchor="middle" dominant-baseline="central">a cycle of</text><text x="722" y="194" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="9.5" font-weight="500" text-anchor="middle" dominant-baseline="central">waiting processes</text><text x="430" y="240" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">all four must hold at once — break any one to prevent deadlock</text></svg>

.0" y="137.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="380.0" dy="0">Application framework</tspan><tspan x="380.0" dy="14">(activity, window, telephony managers)</tspan></text><rect x="160" y="178" width="440" height="52" rx="9" ry="9" fill="#2F5F98"/><text x="380.0" y="197.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="380.0" dy="0">Libraries  +  runtime</tspan><tspan x="380.0" dy="14">(graphics, media, VM/ART)</tspan></text><rect x="160" y="238" width="440" height="52" rx="9" ry="9" fill="#D9922B"/><text x="380.0" y="264.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="380.0" dy="0">Hardware abstraction layer (HAL)</tspan></text><rect x="160" y="298" width="440" height="52" rx="9" ry="9" fill="#55637A"/><text x="380.0" y="317.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="380.0" dy="0">Kernel</tspan><tspan x="380.0" dy="14">(power, drivers, memory, IPC)</tspan></text></svg>
